<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Домашнее задание</title>

    <style>
        .container {
            width: 400px;
        }

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .homework {
            width: 400px;
            padding: 30px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .homework h1 {
            margin: 0 0 20px;
            text-align: center;
            font-size: 24px;
        }

        .homework input,
        .homework textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .homework button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #333;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .homework button:hover {
            background: #555;
        }
    </style>
</head> 
<body>

    <div class="container">
        <form class="homework" action="/api/get_homework" method="post" enctype="multipart/form-data">
            <input
                type="text"
                name="group"
                placeholder="Группа"
                required
            >

            <input
                type="text"
                name="key"
                placeholder="Ключ"
                required
            >

            <button class="button">Получить домашнее задание</button>
        </form>

    </div>

</body> 
</html>
